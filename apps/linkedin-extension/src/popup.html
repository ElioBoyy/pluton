<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Pluton LinkedIn</title>
<style>
  :root { color-scheme: dark; --bg: #0e0e12; --panel: #1b1b22; --ink: #f4f4f7; --muted: #9a9aa6; --accent: #4f5bff; --ok: #34c759; --warn: #ff9f0a; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { width: 340px; margin: 0; padding: 16px; background: var(--bg); color: var(--ink); font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { margin: 0 0 2px; font-size: 15px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  .state { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; padding: 10px 12px; border-radius: 10px; background: var(--panel); }
  .dot { width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--warn); }
  .dot.ok { background: var(--ok); }
  a { color: #9ba3ff; }
  form { display: flex; flex-direction: column; gap: 8px; }
  label { font-size: 12px; color: var(--muted); }
  input, textarea { width: 100%; border: 0; border-radius: 8px; padding: 8px 10px; background: var(--panel); color: var(--ink); font: inherit; }
  textarea { resize: vertical; min-height: 60px; }
  button { height: 34px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; font: inherit; font-weight: 600; }
  button:disabled { opacity: 0.5; }
  #result { min-height: 18px; }
  ul { margin: 14px 0 0; padding: 0; list-style: none; }
  li { display: flex; justify-content: space-between; gap: 8px; padding: 6px 0; border-top: 1px solid #ffffff14; font-size: 12px; }
  li span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
  <h1>Pluton LinkedIn</h1>
  <p class="muted">Envoie les étapes LinkedIn depuis ce navigateur, tant qu'il est ouvert.</p>

  <div class="state"><span class="dot" id="dot"></span><span id="state">Vérification…</span></div>

  <form id="test">
    <label for="url">Invitation de test : profil LinkedIn</label>
    <input id="url" type="url" placeholder="https://www.linkedin.com/in/…" required />
    <label for="note">Note (facultative, 300 caractères max)</label>
    <textarea id="note" maxlength="300"></textarea>
    <button id="send" type="submit">Envoyer l'invitation</button>
    <p id="result" class="muted"></p>
  </form>

  <ul id="history"></ul>
  <script type="module" src="popup.js"></script>
</body>
</html>
